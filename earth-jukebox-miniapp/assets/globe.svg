<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="space-ocean" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#00d2d3"/>
      <stop offset="40%" stop-color="#1e3799"/>
      <stop offset="100%" stop-color="#0c2461"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Atmosphere Outer Glow -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="#00d2d3" stroke-width="4" filter="url(#glow)" opacity="0.8"/>
  <circle cx="250" cy="250" r="225" fill="url(#space-ocean)"/>

  <!-- Rotating Continents Layer -->
  <g class="svg-continents" fill="#00d2d3" opacity="0.65">
    <path d="M120 180 Q160 120 220 190 T320 220 T400 160 T480 240 V380 H100 Z"/>
    <circle cx="180" cy="220" r="45"/>
    <circle cx="360" cy="190" r="60"/>
    <circle cx="280" cy="320" r="50"/>
  </g>
</svg>
